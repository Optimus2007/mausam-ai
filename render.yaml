# Render Blueprint — connect this GitHub repo at https://dashboard.render.com/blueprints
# Render builds the Dockerfile and redeploys on every push to main.
#
# The service starts in labelled DEMO MODE. To go live, add OPENWEATHER_API_KEY in
# Render → mausam-ai → Environment (it is stored as a secret and never reaches the browser).
services:
  - type: web
    name: mausam-ai
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: OPENWEATHER_ONECALL
        value: auto
      - key: ALLOWED_ORIGINS
        value: https://optimus2007.github.io,http://localhost:5173
      - key: RATE_LIMIT_PER_MINUTE
        value: "90"
